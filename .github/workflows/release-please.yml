name: Release Please

# Automates releases using conventional commits
# - Creates/updates release PR based on commits
# - Generates CHANGELOG.md automatically
# - Creates GitHub releases with version tags for marketplace
# - Does not move the shared latest alias; promotion is separately approved

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Flowcore Release Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Create or update release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      
      - name: Display Release Information
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "🎉 Release created!"
          echo "Tag: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"
          echo "Release PR: ${{ steps.release.outputs.pr }}"
